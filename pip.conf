# Equinix-Vorgabe: Python-Pakete nur über den Nexus-Mirror beziehen.
# Lokal aktivieren mit:  export PIP_CONFIG_FILE=$PWD/pip.conf   (Linux/macOS)
#                        $env:PIP_CONFIG_FILE="$PWD\pip.conf"   (PowerShell)
[global]
index-url = https://nexus.equinix.com/repository/pypi-mirror/simple/
disable-pip-version-check = true
